name: CI

# The release workflow used to be the first place the Android build ever ran,
# so a break in it only surfaced while cutting a release. This runs the same
# builds on every push and pull request instead.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libpango1.0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      # Reports only — the tree currently has 15 pre-existing clippy warnings
      # (collapsible `if`s, missing `Default` impls, `too_many_arguments`), so
      # `-D warnings` would fail every build until those are cleared. Clear
      # them, then add `-- -D warnings` to make this a real gate.
      - name: Clippy
        run: cargo clippy --all-targets

  android:
    name: Android build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only arm64 here: this job exists to catch compile breaks in the
          # `cfg(target_os = "android")` code and in the Gradle wiring, and one
          # ABI proves both. The release build does all four.
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Java must come first: sdkmanager is compiled for Java 17, and the
      # runner's default JDK is older, so running setup-android before this
      # fails with UnsupportedClassVersionError while accepting licenses.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: |
            platforms;android-34
            build-tools;34.0.0
            ndk;26.3.11579264

      - name: Build native library
        run: |
          cargo ndk -t arm64-v8a -P 24 \
            -o android/app/build/intermediates/cargo-ndk-out \
            build --release

      - name: Build APK
        run: |
          cd android
          # Debug variant: assembleRelease needs a signing key to be meaningful
          # and runs R8, neither of which this check needs.
          ./gradlew :app:assembleDebug
