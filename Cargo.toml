[package]
name = "mdview"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A simple, fast and lightweight standalone Markdown Viewer"
license = "GPL-3.0-only"
authors = ["Andreas Daasch"]
readme = "README.md"

[lib]
name = "mdview"
path = "src/lib.rs"
# On Android we build a `cdylib` so cargo-ndk can copy the resulting
# `libmdview.so` into the APK's `jniLibs/<abi>/` directory. On other targets
# we keep the default `rlib` so the desktop binary can link against it.
crate-type = ["rlib", "cdylib"]

# Shared by every target. Note that `eframe` is deliberately *not* here: Cargo
# unifies features across dependency edges, so a plain `eframe = "0.33"` in this
# section would re-enable eframe's default features on Android and make the
# `default-features = false` below a no-op. Each target declares its own.
[dependencies]
egui_extras = { version = "0.33", features = ["image"] }
pulldown-cmark = { version = "0.13", features = ["simd"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
log = "0.4"

# Android-specific dependencies. The `android-game-activity` feature on
# `eframe` pulls in `winit`'s Android backend which in turn uses
# `android-activity`. We use the `jni` crate directly for the small set of
# JNI calls in `android_shim.rs`.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.33", default-features = false, features = [
    "android-game-activity",
    "default_fonts",
    "glow",
] }
winit = "0.30"
jni = "0.22"
android-activity = "0.6"

# Desktop-only. `clap` parses a command line Android never has, `notify`
# watches via inotify which does not work on SAF-backed storage (see
# src/watcher.rs), and `rfd`/`open` are desktop shells. Keeping them in the
# shared section compiled all of them into the APK to sit unused.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = "0.33"
rfd = "0.17"
open = "5"
clap = { version = "4.6", features = ["derive"] }
notify = "7"
notify-debouncer-mini = "0.7"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
name = "mdview"
section = "utils"
priority = "optional"
depends = "$auto"
maintainer-scripts = "packaging/linux/deb-scripts"
assets = [
    ["target/release/mdview", "usr/bin/mdview", "755"],
    ["README.md", "usr/share/doc/mdview/README.md", "644"],
    ["LICENSE", "usr/share/doc/mdview/LICENSE", "644"],
    ["packaging/linux/mdview.desktop", "usr/share/applications/mdview.desktop", "644"],
    ["assets/app-icon.png", "usr/share/pixmaps/mdview.png", "644"],
    ["packaging/linux/mdview.xml", "usr/share/mime/packages/mdview.xml", "644"],
]

[package.metadata.generate-rpm]
name = "mdview"
post_install_script = """
if command -v update-mime-database >/dev/null 2>&1; then
  update-mime-database /usr/share/mime >/dev/null 2>&1 || true
fi
if command -v update-desktop-database >/dev/null 2>&1; then
  update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
fi
"""
post_uninstall_script = """
if command -v update-mime-database >/dev/null 2>&1; then
  update-mime-database /usr/share/mime >/dev/null 2>&1 || true
fi
if command -v update-desktop-database >/dev/null 2>&1; then
  update-desktop-database /usr/share/applications >/dev/null 2>&1 || true
fi
"""
assets = [
    { source = "target/release/mdview", dest = "/usr/bin/mdview", mode = "755", doc = false },
    { source = "README.md", dest = "/usr/share/doc/mdview/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/mdview/LICENSE", mode = "644", doc = true },
    { source = "packaging/linux/mdview.desktop", dest = "/usr/share/applications/mdview.desktop", mode = "644" },
    { source = "assets/app-icon.png", dest = "/usr/share/pixmaps/mdview.png", mode = "644" },
    { source = "packaging/linux/mdview.xml", dest = "/usr/share/mime/packages/mdview.xml", mode = "644" },
]
